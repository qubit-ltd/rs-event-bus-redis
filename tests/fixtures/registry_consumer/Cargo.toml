[package]
name = "registry-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["sync", "async", "discovery"]
sync = ["qubit-event-bus-redis/sync"]
async = ["qubit-event-bus-redis/async"]
discovery = ["qubit-event-bus/discovery", "qubit-event-bus-redis/discovery"]

[dependencies]
qubit-event-bus = { version = "^0.21", default-features = false }
qubit-event-bus-redis = { version = "^0.7", default-features = false , path = "../../../" }
qubit-spi = "^0.14"

