[package]
name = "redis-event-bus-async-tokio-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
qubit-event-bus-redis = { version = "0.7", path = "../../..", default-features = false, features = ["async"] }
qubit-event-bus = { version = "0.20", path = "../../../../rs-event-bus", default-features = false }
qubit-spi = "0.13"
qubit-id = { version = "0.7", default-features = false, features = ["uuid"] }
tokio = { version = "1.53", features = ["rt", "macros"] }

[patch.crates-io]
redis = { path = "../../../third_party/redis-rs" }
qubit-event-bus = { version = "0.20", path = "../../../../rs-event-bus" }
