[package]
name = "redis-event-bus-task-notifications"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
qubit-event-bus-redis = { path = "../../..", default-features = false, features = ["sync", "discovery"] }
qubit-event-bus = { version = "0.18.0", path = "../../../../rs-event-bus", default-features = false, features = ["discovery"] }
qubit-task = { path = "../../../../rs-task", features = ["event-bus"] }
qubit-codec = { path = "../../../../rs-codec" }
qubit-id = { path = "../../../../rs-id" }
qubit-model-metadata = { path = "../../../../rs-model-metadata" }
qubit-spi = "0.13"
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[patch.crates-io]
qubit-event-bus = { version = "0.18.0", path = "../../../../rs-event-bus" }
