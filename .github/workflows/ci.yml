name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      registry_consumer:
        description: Run registry compatibility checks for a specified version combination
        required: false
        type: boolean
        default: false
      provider_version:
        description: Published qubit-event-bus-redis version (X.Y.Z)
        required: false
        type: string
      core_version:
        description: Published qubit-event-bus version (X.Y.Z)
        required: false
        type: string
      spi_version:
        description: Published qubit-spi version (X.Y.Z)
        required: false
        type: string
      registry_consumer_mode:
        description: Registry compatibility validation mode
        required: false
        type: choice
        options:
          - source-candidate
          - published
        default: source-candidate

env:
  RS_EVENT_BUS_PIN: "1"

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  documentation-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Prepare local path dependencies
        run: bash ./ci/prepare-event-bus.sh
      - name: Test task notification downstream integration
        run: cargo +1.94.0 test --test downstream_tests test_task_notifications_preserve_monotonic_projection_and_business_state --all-features --locked -- --exact --test-threads=1
      - name: Build all runnable provider examples
        run: cargo +1.94.0 build --examples --all-features --locked
      - name: Run examples against standalone Redis and Sentinel
        run: cargo +1.94.0 test --test documentation_examples_tests --all-features --locked -- --test-threads=1
      - name: Run applied-reply cancellation regressions
        run: |
          cargo +1.94.0 test --test controlled_redis_tests --all-features --locked -- --test-threads=1
          cargo +1.94.0 test --test sync_standalone_tests test_sync_settlement_retry_after_applied_xack_reply_loss --all-features --locked -- --exact
          cargo +1.94.0 test --test async_standalone_tests test_async_receive_cancellation_leaves_pending_message_recoverable --all-features --locked -- --exact
          cargo +1.94.0 test --test async_standalone_tests test_async_claim_cancellation_after_owner_transfer_recovers_message --all-features --locked -- --exact
          cargo +1.94.0 test --test async_standalone_tests test_async_settlement_cancellation_after_xack_is_idempotent --all-features --locked -- --exact

  registry-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.registry_consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Check published registry packages from an isolated consumer
        env:
          PROVIDER_VERSION: ${{ inputs.provider_version }}
          CORE_VERSION: ${{ inputs.core_version }}
          SPI_VERSION: ${{ inputs.spi_version }}
          REGISTRY_CONSUMER_MODE: ${{ inputs.registry_consumer_mode }}
        run: bash ./ci/check-registry-consumer.sh --mode "$REGISTRY_CONSUMER_MODE" --provider-version "$PROVIDER_VERSION" --core-version "$CORE_VERSION" --spi-version "$SPI_VERSION"
