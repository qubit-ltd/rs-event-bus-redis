[package]
name = "qubit-event-bus-redis"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-event-bus-redis"
description = "Synchronous and asynchronous Redis Streams providers for Qubit Event Bus"
homepage = "https://github.com/qubit-ltd/rs-event-bus-redis"
documentation = "https://docs.rs/qubit-event-bus-redis"
readme = "README.md"
include = ["/Cargo.toml", "/LICENSE", "/README*", "/doc/**/*.md", "/src/**", "/tests/**"]

[features]
default = ["sync", "async", "discovery"]
sync = ["dep:redis", "redis/streams"]
async = ["dep:redis", "redis/smol-comp", "redis/streams"]
discovery = ["sync", "async", "qubit-event-bus/discovery", "qubit-spi/inventory"]

[dependencies]
qubit-event-bus = { version = "0.14.0", path = "../rs-event-bus" }
qubit-spi = "0.13"
redis = { version = "0.32.7", default-features = false, features = ["streams", "sentinel"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures-lite = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }
