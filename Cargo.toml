[package]
name = "qubit-event-bus-redis"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-event-bus-redis"
description = "Synchronous and asynchronous Redis Streams providers for Qubit Event Bus"
homepage = "https://github.com/qubit-ltd/rs-event-bus-redis"
documentation = "https://docs.rs/qubit-event-bus-redis"
readme = "README.md"
include = ["/Cargo.toml", "/LICENSE", "/README*", "/doc/**/*.md", "/src/**", "/tests/**"]

[workspace]
resolver = "3"

[features]
default = ["sync", "async", "discovery"]
sync = ["redis/streams"]
async = ["dep:async-lock", "redis/smol-comp", "redis/streams"]
discovery = ["qubit-event-bus/discovery", "qubit-spi/inventory"]
conformance = ["qubit-event-bus/conformance"]

[dependencies]
qubit-event-bus = { version = "0.16.0", path = "../rs-event-bus" }
qubit-spi = "0.13"
qubit-id = { version = "0.6", default-features = false, features = ["uuid"] }
async-lock = { version = "^3", optional = true }
redis = { version = "^0.32.7", default-features = false, features = ["streams", "sentinel"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
thiserror = "^2.0"

[dev-dependencies]
futures-lite = "^2"
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp", "streams", "sentinel"] }
tempfile = "^3.27"
tokio = { version = "^1.53", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }
