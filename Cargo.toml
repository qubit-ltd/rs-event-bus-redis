[package]
name = "qubit-event-bus-redis"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-event-bus-redis"
description = "Synchronous and asynchronous Redis Streams providers for Qubit Event Bus"
homepage = "https://github.com/qubit-ltd/rs-event-bus-redis"
documentation = "https://docs.rs/qubit-event-bus-redis"
readme = "README.md"
include = ["/Cargo.toml", "/LICENSE", "/README*", "/CHANGELOG*", "/doc/**/*.md", "/src/**", "/tests/**", "/examples/**", "/benches/**"]

[workspace]
resolver = "3"

[features]
default = ["sync", "async", "discovery"]
sync = ["redis/streams"]
async = ["dep:async-lock", "redis/smol-rustls-comp", "redis/streams"]
discovery = ["qubit-event-bus/discovery", "qubit-spi/inventory"]
conformance = ["qubit-event-bus/conformance"]

[dependencies]
qubit-event-bus = { version = "0.20", path = "../rs-event-bus" }
qubit-spi = "0.13"
qubit-id = { version = "0.7", default-features = false, features = ["uuid"] }
async-lock = { version = "^3", optional = true }
redis = { version = "^0.32.7", default-features = false, features = ["streams", "sentinel", "tls-rustls-webpki-roots"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
thiserror = "^2.0"
rustls = { version = "^0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
qubit-retry = "0.26"
qubit-retry-025 = { package = "qubit-retry", version = "0.25" }
futures-lite = "^2"
futures-channel = "^0.3"
redis = { version = "0.32.7", default-features = false, features = ["tokio-rustls-comp", "streams", "sentinel", "tls-rustls-webpki-roots"] }
tempfile = "^3.27"
tokio = { version = "^1.53", features = ["rt", "macros"] }

[[example]]
name = "sync_orders"
required-features = ["sync", "discovery"]

[[example]]
name = "async_orders"
required-features = ["async", "discovery"]

[[example]]
name = "sentinel_orders"
required-features = ["sync", "discovery"]

[[test]]
name = "documentation_examples_tests"
path = "tests/documentation_examples_tests.rs"
required-features = ["sync", "async", "discovery"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }

[[bench]]
name = "redis_workloads"
harness = false
required-features = ["sync", "async"]

[patch.crates-io]
redis = { path = "third_party/redis-rs" }
